# pnpm 11 defaults this to `install`, which prints status lines on stdout
# before `pnpm exec`/`pnpm run` and can hang nested invocations in CI.
verifyDepsBeforeRun: false
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
overrides:
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "@vitest/mocker@<4.1.12": ">=4.1.12"
  "postcss@<8.5.23": ">=8.5.23"
  "source-map-js@<1.2.2": ">=1.2.2"
  "undici@>=7.0.0 <7.28.0": ">=7.28.0"
  "vite@>=7.0.0 <=7.3.4": ">=7.3.5"
