name: "irida-next"
services:
  browserless:
    environment:
      CONCURRENT: 10
      HOST: browserless
      PORT: 3333
      TIMEOUT: 900000
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    volumes:
      - ../..:/workspaces:cached
  docker:
    image: docker:dind
    privileged: true
    restart: unless-stopped
    volumes:
      - ../..:/workspaces:cached
      - docker-data:/certs
      - sapporo-data:/opt/sapporo-runs
  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:18.1
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      - browserless
      - postgres
      - sapporo
      - vnu
    volumes:
      - ../..:/workspaces:cached
  sapporo:
    build:
      context: https://github.com/phac-nml/sapporo-service.git#irida-next
      dockerfile: Dockerfile-irida-next
    command: sapporo
    depends_on:
      - docker
    environment:
      DOCKER_CERT_PATH: /certs/client
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: 1
      IRIDA_NEXT_PATH: /workspaces/irida-next
      SAPPORO_HOST: 0.0.0.0
      SAPPORO_PORT: 1122
      SAPPORO_RUN_DIR: /opt/sapporo-runs
      SAPPORO_RUN_SH: /app/sapporo/run_irida_next.sh
    ports:
      - "1122:1122"
    volumes:
      - ../..:/workspaces:cached
      - docker-data:/certs:ro
      - sapporo-data:/opt/sapporo-runs
  vnu:
    image: ghcr.io/validator/validator:latest
    ports:
      - "8888:8888"
    restart: always
volumes:
  docker-data: null
  postgres-data: null
  sapporo-data: null
